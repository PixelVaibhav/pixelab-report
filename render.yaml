services:
  - type: web
    name: pixelab-report
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: WORKERS
        value: "2"
      - key: MAX_CONCURRENT
        value: "1"
      - key: RATE_LIMIT
        value: "5"
